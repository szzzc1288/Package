name: Manual Cleanup Repo

on:
  workflow_dispatch:

permissions:
  contents: write   # 允许 push 修改仓库内容

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 使用默认token，有写权限

      - name: Delete all files except whitelist
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'main.sh' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            ! -name '.github' \
            ! -name '.git' \
            -exec rm -rf {} +

      - name: Show remaining files
        run: ls -la

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "Cleanup: remove all files except whitelist"
            git push
          fi
