name: Manual Cleanup Repo

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}   # 用你设置的 ACCESS_TOKEN，而不是默认 GITHUB_TOKEN

      - name: Delete all files except whitelist
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'main.sh' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            ! -name '.github' \
            ! -name '.git' \
            -exec rm -rf {} +

      - name: Show remaining files
        run: ls -la

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "Cleanup: remove all files except whitelist"
            git push origin HEAD:main
          fi

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 0
          TOKEN: ${{ secrets.ACCESS_TOKEN }}
