name: Package

on:
  push:
    paths:
      - '.github/workflows/Package.yml'
      - 'diy/**'
  workflow_dispatch:
  schedule:
    - cron: 10 02 * * 0
  watch:
    types: started
  repository_dispatch:

env:
  TOKEN: ${{ secrets.ACCESS_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  
jobs:
  check:
    runs-on: ubuntu-latest

    name: Update ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [main]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Initialization environment
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        sudo timedatectl set-timezone "Asia/Shanghai"
        
    - name: Clone packages
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x ${{matrix.target}}.sh
        git clone -b ${{matrix.target}} https://github.com/szzzc1288/Package.git ${{matrix.target}}
        cd ${{matrix.target}}
        git sparse-checkout disable || true
        git rm -r --cache * >/dev/null 2>&1
        rm -rf `find ./* -maxdepth 0 -type d ! -name "diy"` >/dev/null 2>&1
        $GITHUB_WORKSPACE/${{matrix.target}}.sh

    - name: Clean Nested Git  # 新增完整步骤：清理箭头图标源头
      run: |
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        # 递归删除所有 .git 和 Git 配置
        find . -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
        find . -name ".gitignore" -delete 2>/dev/null || true
        find . -name ".gitmodules" -delete 2>/dev/null || true
        find . -name ".gitattributes" -delete 2>/dev/null || true
        # 清理 Git 索引中的嵌套仓库记录
        git rm -r --cached . 2>/dev/null || true
        git add .

    - name: Upload Package
      env: 
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        [ -e $GITHUB_WORKSPACE/LICENSE ] && cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/${{matrix.target}}
        [ -e $GITHUB_WORKSPACE/README.md ] && cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/${{matrix.target}}
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        git add .
        git commit -am "update $(date +%Y-%m-%d" "%H:%M:%S)" || true
        git push --quiet "https://${{ secrets.ACCESS_TOKEN }}@github.com/szzzc1288/Package.git" HEAD:${{matrix.target}}

    # 🆕 新增步骤：Telegram 成功通知
    - name: Send Telegram Notification
      if: success() # 🆕 只在之前步骤成功时执行
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d text="✅ *Package 更新成功* %0A*仓库:* [szzzc1288/Package](https://github.com/szzzc1288/Package) %0A*触发者:* ${{ github.actor }} %0A*时间:* $(date +'%Y-%m-%d %H:%M:%S')"

    # 🆕（可选）新增步骤：Telegram 失败通知
    - name: Send Telegram Notification (on failure)
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d "text=❌ *Package 更新失败* %0A$(date +'%Y-%m-%d %H:%M:%S')"
             
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 4
        TOKEN: ${{ secrets.ACCESS_TOKEN }}
