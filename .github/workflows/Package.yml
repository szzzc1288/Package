name: Package

on:
  push:
    paths:
      - '.github/workflows/Package.yml'
      - 'diy/**'
  workflow_dispatch:
  schedule:
    - cron: 10 02 * * 0
  watch:
    types: started
  repository_dispatch:

env:
  TOKEN: ${{ secrets.ACCESS_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  
jobs:
  check:
    runs-on: ubuntu-latest

    name: Update ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [main]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Initialization environment
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        sudo timedatectl set-timezone "Asia/Shanghai"
        
    - name: Clone packages
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x ${{matrix.target}}.sh
        
        # 全新开始：删除重建
        rm -rf ${{matrix.target}}
        git clone -b ${{matrix.target}} https://github.com/szzzc1288/Package.git ${{matrix.target}}
        cd ${{matrix.target}}
        
        # 干净创建 diy 目录
        rm -rf diy
        mkdir -p diy
        cd diy
        
        # 在干净目录运行 main.sh
        $GITHUB_WORKSPACE/${{matrix.target}}.sh
        
        # 返回根目录
        cd $GITHUB_WORKSPACE/${{matrix.target}}

    - name: Clean Nested Git
      run: |
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        # 只清理 diy 中的残留 Git 文件
        find diy -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
        find diy -name ".gitignore" -delete 2>/dev/null || true
        find diy -name ".gitmodules" -delete 2>/dev/null || true
        find diy -name ".gitattributes" -delete 2>/dev/null || true

    - name: Upload Package
      env: 
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        [ -e $GITHUB_WORKSPACE/LICENSE ] && cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/${{matrix.target}}
        [ -e $GITHUB_WORKSPACE/README.md ] && cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/${{matrix.target}}
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        
        # 终极清理：删除所有 .git + 移除 Git 索引记录
        find . -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
        find . -name ".git*" -delete 2>/dev/null || true
        
        # 移除所有嵌套仓库的 Git 索引记录（解决箭头）
        git rm -r --cached . -r --ignore-unmatch 2>/dev/null || true
        git add . --renormalize
        
        # 禁用警告 + 强制 commit
        git config advice.updateSparsePath false
        git commit -am "update $(date +'%Y-%m-%d %H:%M:%S')" || true
        git push --quiet "https://${{ secrets.ACCESS_TOKEN }}@github.com/szzzc1288/Package.git" HEAD:${{matrix.target}} || true


    - name: Send Telegram Notification
      if: success()
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d text="✅ *Package 更新成功* %0A*仓库:* [szzzc1288/Package](https://github.com/szzzc1288/Package) %0A*触发者:* ${{ github.actor }} %0A*时间:* $(date +'%Y-%m-%d %H:%M:%S')"

    - name: Send Telegram Notification (on failure)
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d "text=❌ *Package 更新失败* %0A$(date +'%Y-%m-%d %H:%M:%S')"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 4
        TOKEN: ${{ secrets.ACCESS_TOKEN }}
