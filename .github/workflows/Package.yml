name: Package

on:
  push:
    paths:
      - '.github/workflows/Package.yml'
      - 'diy/**'
  workflow_dispatch:
  schedule:
    - cron: 10 02 * * 0
  watch:
    types: started
  repository_dispatch:

env:
  TOKEN: ${{ secrets.ACCESS_TOKEN }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  
jobs:
  check:
    runs-on: ubuntu-latest

    name: Update ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [main]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Initialization environment
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        sudo timedatectl set-timezone "Asia/Shanghai"
        
    - name: Clone packages
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x ${{matrix.target}}.sh

        # 删掉旧的 Package 仓库，保证每次都是全新的
        rm -rf ${{matrix.target}}
        git clone -b ${{matrix.target}} https://github.com/szzzc1288/Package.git ${{matrix.target}}
        cd ${{matrix.target}}

        # 删掉旧 diy，重新创建一个干净目录
        rm -rf diy
        mkdir -p diy
        cd diy

        # 在干净的 diy 目录里执行 main.sh，只负责拉最新包
        $GITHUB_WORKSPACE/${{matrix.target}}.sh

        # 回到 Package 根目录准备提交
        cd $GITHUB_WORKSPACE/${{matrix.target}}

    - name: Upload Package
      env: 
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        cd $GITHUB_WORKSPACE/${{matrix.target}}

        # 把根仓库里的 LICENSE / README 覆盖到 Package 仓库
        [ -e $GITHUB_WORKSPACE/LICENSE ] && cp $GITHUB_WORKSPACE/LICENSE .
        [ -e $GITHUB_WORKSPACE/README.md ] && cp $GITHUB_WORKSPACE/README.md .

        # 简单粗暴：全部 add + commit + push，忽略可能的空提交错误
        git add .
        git commit -am "update $(date +'%Y-%m-%d %H:%M:%S')" || true
        git push --quiet "https://${{ secrets.ACCESS_TOKEN }}@github.com/szzzc1288/Package.git" HEAD:${{matrix.target}} || true

    - name: Send Telegram Notification
      if: success()
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d text="✅ *Package 更新成功* %0A*仓库:* [szzzc1288/Package](https://github.com/szzzc1288/Package) %0A*触发者:* ${{ github.actor }} %0A*时间:* $(date +'%Y-%m-%d %H:%M:%S')"

    - name: Send Telegram Notification (on failure)
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
          -d chat_id=${TELEGRAM_CHAT_ID} \
          -d parse_mode="Markdown" \
          -d "text=❌ *Package 更新失败* %0A$(date +'%Y-%m-%d %H:%M:%S')"

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 4
        TOKEN: ${{ secrets.ACCESS_TOKEN }}
